name: StudySprint quality gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check study-core.js
          node --check config.js
          node --check maxi-plus.js
          node --check worker.js
