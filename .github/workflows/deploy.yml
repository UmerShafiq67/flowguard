name: Deploy StudySprint to GitHub Pages
# V61 whole-product responsive dashboard verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check account.js
          node --check study-core.js
          node --check config.js
          node --check maxi-plus.js
          cp worker.js /tmp/studysprint-worker.mjs
          node --check /tmp/studysprint-worker.mjs
          node --check enhancements.js
      - name: Run core tests
        run: npm test
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f study-core.js
          test -f maxi-plus.js
          test -f worker.js
          test -f config.js
          test -f enhancements.js
          test -f visual-v61.css
          test -f assets/adaptive-learning-system.svg
          test -f assets/study-hero.svg
          test -f assets/today-progress.svg
          test -f assets/plan-visual.svg
          test -f assets/subjects-visual.svg
          test -f assets/session-visual.svg
          test -f assets/practice-visual.svg
          test -f assets/tutor-visual.svg
          test -f assets/review-visual.svg
          test -f assets/progress-visual.svg
          test -f assets/focus-visual.svg
          test -f manifest.webmanifest
          test -f sw.js
          grep -q 'visual-v61.css?v=66' index.html
          grep -q 'studysprint-shell-v89-premium-v66' sw.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 300
