name: Deploy StudySprint to GitHub Pages
# V53 dashboard verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check account.js
          node --check study-core.js
          node --check config.js
          node --check maxi-plus.js
          cp worker.js /tmp/studysprint-worker.mjs
          node --check /tmp/studysprint-worker.mjs
          node --check enhancements.js
          node --check visual-v45.js
      - name: Run core tests
        run: npm test
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f study-core.js
          test -f maxi-plus.js
          test -f worker.js
          test -f config.js
          test -f enhancements.js
          test -f visual-v49.css
          test -f visual-v50.css
          test -f visual-v51.css
          test -f visual-v52.css
          test -f visual-v53.css
          test -f visual-v54.css
          test -f assets/adaptive-learning-system.svg
          test -f manifest.webmanifest
          test -f sw.js
          test -f visual-v45.js
          grep -q 'visual-v51.css?v=51' index.html
          grep -q 'visual-v52.css?v=52' index.html
          grep -q 'visual-v53.css?v=53' index.html
          grep -q 'visual-v54.css?v=54' index.html
          grep -q 'studysprint-shell-v74-v54' sw.js
          grep -q 'visual-v54.css?v=54' sw.js
          grep -q 'visual-v53.css?v=53' sw.js
          grep -q 'visual-v52.css?v=52' sw.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 300
