services:
  - type: web
    name: studysprint-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: huggingface
      - key: HF_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: HF_TOKEN
        sync: false
      - key: CORS_ORIGIN
        value: "*"
